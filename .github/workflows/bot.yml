name: AI News Bot

on:
  # زمان‌بندی: هر ۳ ساعت یکبار اجرا می‌شود (زمان به UTC است)
  schedule:
    - cron: "0 */3 * * *"
  # اجازه اجرای دستی برای تست
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests
        
      - name: Run Bot
        run: python main.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
