name: Weekly AI Bulletin

on:
  schedule:
    # هر جمعه ساعت ۱۵:۳۰ به وقت UTC (معادل شنبه ۰۰:۰۰ / جمعه ۸ شب به وقت ایران)
    - cron: "30 15 * * 5"
  workflow_dispatch:

# Same concurrency group as the daily bot — they share posted_history.json.
concurrency:
  group: bot-history
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODE: WEEKLY

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Weekly Bot
        run: python main.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}

      - name: Save Memory to GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add posted_history.json
          if [[ -n "$(git status --porcelain posted_history.json)" ]]; then
            git commit -m "chore(history): auto-update weekly bulletin URLs [skip ci]"
            git push --force-with-lease
          else
            echo "No history changes to commit."
          fi
