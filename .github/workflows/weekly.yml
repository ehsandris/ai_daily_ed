name: Weekly AI Bulletin

on:
  schedule:
    # هر جمعه ساعت ۱۵:۳۰ به وقت UTC (معادل شنبه ۰۰:۰۰ / جمعه ۸ شب به وقت ایران)
    - cron: "30 15 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install requests feedparser ollama
        
      - name: Run Weekly Bot
        run: python main.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          MODE: WEEKLY # این متغیر به ربات می‌فهماند که باید بولتن بسازد
